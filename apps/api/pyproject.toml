[project]
name = "NEIMAN-api"
version = "1.0.1"
description = "NEIMAN — Autonomous Organization OS API"
requires-python = ">=3.11, <3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "structlog>=24.1.0",
    "python-multipart>=0.0.9",
    "faker>=40.40.0",
    "rich>=13.7.0",
    "textual>=0.50.0",
    "aiosqlite>=0.20.0",
    "lancedb>=0.40.0",
    "fastembed>=0.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["nexora*"]


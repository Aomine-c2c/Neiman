      <stop offset="22%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="78%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="goldBevel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="30%" stop-color="#D97706" />
      <stop offset="65%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>

    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <radialGradient id="pommelRadial" cx="35%" cy="32%" r="68%">
